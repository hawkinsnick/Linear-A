name: Four corpus selected source collation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selected-source-collation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python corpus-factory/validate_source_collation_20261015.py
      - run: python -m unittest discover -s corpus-factory -p test_source_collation_20261015.py
      - run: python corpus-factory/validate_attribution_reviews.py
      - run: python corpus-factory/validate_evidence_queries.py
