name: Materialized 18-member mega corpus
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s corpus-factory -p test_mega_corpus.py
      - name: Acquire declared native repositories
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, pathlib, subprocess
          registry = json.loads(pathlib.Path('combined-ai-skill/registry/corpus-projects.json').read_text())
          checkouts = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mega-checkouts'
          checkouts.mkdir()
          def acquire(member):
              repo = member['repository']
              if repo.split('/')[0] != 'hawkinsnick' or repo.endswith(('/LightroomIsSlow', '/Egyptian-Hieroglyphic-Corpus')):
                  raise ValueError('unexpected repository scope')
              target = checkouts / repo.split('/')[-1]
              if repo == 'hawkinsnick/Linear-A':
                  target.symlink_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']))
              else:
                  subprocess.run(['git', 'clone', '--quiet', '--depth=1', 'https://github.com/' + repo + '.git', str(target)], check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(acquire, registry['members']))
          PY
      - name: Materialize authenticated private A/B source views
        run: |
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/sigla-corpus.json" https://github.com/ryanpavlicek/pyaegean/releases/download/sigla-corpus-v4/sigla-corpus.json
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/damos-corpus.json" https://github.com/ryanpavlicek/pyaegean/releases/download/damos-corpus-v2/damos-corpus.json
          python "$RUNNER_TEMP/mega-checkouts/Linear-A/scripts/build_pre_expert_audit.py" "$RUNNER_TEMP/sigla-corpus.json" --report "$RUNNER_TEMP/la-source-replay.json"
          python "$RUNNER_TEMP/mega-checkouts/Linear-B/scripts/build_pre_expert_audit.py" "$RUNNER_TEMP/damos-corpus.json" --report "$RUNNER_TEMP/lb-source-replay.json"
          cmp "$RUNNER_TEMP/la-source-replay.json" analysis/pre-expert-source-audit.json
          cmp "$RUNNER_TEMP/lb-source-replay.json" "$RUNNER_TEMP/mega-checkouts/Linear-B/analysis/pre-expert-source-audit.json"
      - name: Build and verify actual combined native package
        run: |
          python corpus-factory/build_mega_corpus.py --checkouts "$RUNNER_TEMP/mega-checkouts" --output "$RUNNER_TEMP/mega-corpus" --include-local > "$RUNNER_TEMP/mega-corpus-build-report.json"
          python corpus-factory/build_mega_corpus.py --output "$RUNNER_TEMP/mega-corpus" --verify > "$RUNNER_TEMP/mega-corpus-verification.json"
          python corpus-factory/query_mega_corpus.py "$RUNNER_TEMP/mega-corpus" --repository hawkinsnick/Cretan-hieroglyphs --text CHIC-328 --limit 1 > "$RUNNER_TEMP/private-mega-query.json"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root / 'mega-corpus-build-report.json').read_text())
          assert manifest['registered_members'] == manifest['materialized_members'] == 18
          assert manifest['scientific_approval_granted'] is False
          views = {(m['repository'], v['view']): v for m in manifest['members'] for v in m['views']}
          assert views[('hawkinsnick/Anatolian-Hieroglyphic', 'ediana-digital-entry-dossiers')]['rows'] == 287
          assert views[('hawkinsnick/Cypriot-syllabic-Greek', 'bbaw-legacy-syllabic-squeeze-identifiers')]['rows'] == 210
          assert views[('hawkinsnick/Linear-A', 'sigla-source-layout')]['rows'] == 802
          assert views[('hawkinsnick/Linear-B', 'kn-fp13-museum-assertions')]['rows'] == 2
          assert views[('hawkinsnick/Byblos-syllabary', 'dunand-1930-ordinal-review')]['rows'] == 123
          assert views[('hawkinsnick/Byblos-syllabary', 'dunand-1930-type-table')]['rows'] == 38
          assert views[('hawkinsnick/Cretan-hieroglyphs', 'dbas-chs-catalogue-leads')]['rows'] == 193
          assert views[('hawkinsnick/Cretan-hieroglyphs', 'inscribe-unmapped-object-pages')]['rows'] == 3
          assert views[('hawkinsnick/Cretan-hieroglyphs', 'inscribe-context-records')]['rows'] == 26
          assert views[('hawkinsnick/Cypro-Minoan', 'louvre-object-concordance')]['rows'] == 9
          assert views[('hawkinsnick/Cypro-Minoan', 'tiryns-primary-context')]['rows'] == 1
          assert views[('hawkinsnick/Cretan-hieroglyphs', 'stratified-context-supplements')]['rows'] == 5
          assert views[('hawkinsnick/Cretan-hieroglyphs', 'representative-acquisition-cohort')]['rows'] == 25
          assert views[('hawkinsnick/Cypro-Minoan', 'dor-2025-provisional-candidates')]['rows'] == 2
          assert manifest['record_view_rows'] == 10791
          result = json.loads((root / 'private-mega-query.json').read_text())
          assert result['returned_rows'] == 1 and result['physical_object_count'] is None
          PY
      - name: Publish aggregate receipts only
        uses: actions/upload-artifact@v4
        with:
          name: mega-corpus-build-receipts
          path: |
            ${{ runner.temp }}/mega-corpus-build-report.json
            ${{ runner.temp }}/mega-corpus-verification.json
