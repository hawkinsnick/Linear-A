name: validate
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_current_state.py
      - run: python scripts/test_current_state.py
      - run: python scripts/validate_corpus.py
      - run: python scripts/audit_claims_3_0.py
      - run: python scripts/test_sigla_delta.py
      - run: python scripts/test_structural_sensitivity.py
      - name: Reproduce pinned historical sensitivity result
        run: |
          python scripts/run_structural_sensitivity_v1.py --spec research/structural-sensitivity-repair-v1.json --words data/source_words.csv --candidates data/candidate_registry_0.9.csv --out /tmp/structural-result.json
          python - <<'PY'
          import pathlib
          assert pathlib.Path('/tmp/structural-result.json').read_bytes() == pathlib.Path('analysis/structural-sensitivity-repair-v1-result.json').read_bytes(), 'Pinned historical sensitivity result drift'
          PY
