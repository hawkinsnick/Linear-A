name: validate
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate_current_state.py
      - run: python scripts/test_current_state.py
      - run: python scripts/validate_pre_expert_audit.py
      - run: python scripts/test_pre_expert_audit.py
      - run: python scripts/build_edition_concordance.py --check
      - run: python scripts/test_edition_concordance.py
      - run: python scripts/build_critical_pilot.py --check
      - run: python scripts/test_critical_pilot.py
      - run: python scripts/validate_corpus.py
      - run: python scripts/audit_claims_3_0.py
      - run: python scripts/test_sigla_delta.py
      - run: python scripts/test_structural_sensitivity.py
      - name: Reproduce pinned historical sensitivity result
        run: |
          python scripts/run_structural_sensitivity_v1.py --spec research/structural-sensitivity-repair-v1.json --words data/source_words.csv --candidates data/candidate_registry_0.9.csv --out /tmp/structural-result.json
          python - <<'PY'
          import pathlib
          assert pathlib.Path('/tmp/structural-result.json').read_bytes() == pathlib.Path('analysis/structural-sensitivity-repair-v1-result.json').read_bytes(), 'Pinned historical sensitivity result drift'
          PY
      - run: python scripts/test_prospective_independence.py

  verify-sigla-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download authenticated source locally
        run: curl --fail --location --retry 4 --output /tmp/sigla-corpus.json https://github.com/ryanpavlicek/pyaegean/releases/download/sigla-corpus-v4/sigla-corpus.json
      - name: Reproduce exact source audit without outcome scoring
        run: |
          python scripts/build_pre_expert_audit.py /tmp/sigla-corpus.json --report /tmp/pre-expert-source-audit.json
          cmp /tmp/pre-expert-source-audit.json analysis/pre-expert-source-audit.json
          python scripts/build_edition_concordance.py /tmp/sigla-corpus.json --check
          python scripts/build_critical_pilot.py /tmp/sigla-corpus.json --check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [integrity, verify-sigla-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish checked native milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat VERSION)
          tag="v$version"
          test -f "releases/$version.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing immutable release $tag retained."
          else
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if test -n "$existing"; then
              test "$existing" = "$GITHUB_SHA"
            else
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
            gh release create "$tag" --verify-tag --latest=true --title "Linear-A $version" --notes-file "releases/$version.md"
          fi
