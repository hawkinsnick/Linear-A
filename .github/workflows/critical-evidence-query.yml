name: Critical evidence query
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/build_critical_pilot.py --check
      - run: python scripts/test_critical_pilot.py
      - run: python scripts/test_critical_evidence_query.py
