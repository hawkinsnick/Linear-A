name: P1 reconciliation contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s corpus-factory -p test_audit_p1.py
      - run: python corpus-factory/validate_fleet.py
      - run: python combined-ai-skill/scripts/validate.py
      - run: python -m unittest discover -s corpus-factory -p test_cross_corpus_dependencies.py
