name: Northwestern research program
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python corpus-factory/validate_northwestern_program.py
      - run: python -m unittest discover -s corpus-factory -p test_northwestern_program.py
      - name: Check out the exact 18 published source revisions
        run: |
          python - <<'PY'
          import concurrent.futures,json,re,subprocess
          from pathlib import Path
          members=json.loads(Path('corpus-factory/northwestern-published-revisions.json').read_bytes())['members']
          registry={m['repository'] for m in json.loads(Path('combined-ai-skill/registry/corpus-projects.json').read_bytes())['members']}
          assert len(members)==len(registry) and {m['repository'] for m in members}==registry
          target=Path('/tmp/native-checkpoints');target.mkdir()
          def clone(m):
              assert m['repository'] in registry and re.fullmatch('[0-9a-f]{40}',m['source_commit'])
              root=target/m['repository'].split('/')[-1]
              subprocess.run(['git','clone','--quiet','--no-checkout','https://github.com/'+m['repository']+'.git',str(root)],check=True)
              subprocess.run(['git','checkout','--quiet','--detach',m['source_commit']],cwd=root,check=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:list(pool.map(clone,members))
          PY
      - run: python corpus-factory/verify_federated_snapshot.py --checkouts /tmp/native-checkpoints
      - run: python /tmp/native-checkpoints/Linear-A/corpus-factory/test_federated_research.py --checkouts /tmp/native-checkpoints
