name: Native evidence and alternatives
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/evidence_query.py --check
      - run: python scripts/test_native_evidence_query.py
      - run: python corpus-factory/validate_evidence_queries.py
      - run: python -m unittest discover -s corpus-factory -p test_evidence_queries.py
