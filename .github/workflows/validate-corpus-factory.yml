name: Validate Corpus Factory
on:
  push:
    branches: [main, corpus-factory-v1]
    paths:
      - 'corpus-factory/**'
  pull_request:
    branches: [main]
    paths:
      - 'corpus-factory/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python corpus-factory/validate_fleet.py
