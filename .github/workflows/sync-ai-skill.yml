name: Sync AI skill
on:
  push:
    branches: [main, ai-skill-v0.1]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'ai-skill/generated/**'
  workflow_dispatch:
concurrency:
  group: sync-ai-skill-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test admission adapter rejection gates
        run: python -m unittest discover -s combined-ai-skill/tests -p 'test_admission_adapter.py' -v
      - name: Validate fleet admission contract
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python combined-ai-skill/scripts/validate_fleet_admission.py
  sync:
    needs: admission
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AI research bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python ai-skill/scripts/build_bundle.py
      - name: Validate generated bundle
        run: python ai-skill/scripts/validate_bundle.py
      - name: Validate Combined AI orchestration contract
        run: python combined-ai-skill/scripts/validate.py
      - name: Test source-parent publication races
        run: python -m unittest discover -s ai-skill/scripts -p test_publish_sync.py
      - name: Publish only on the exact validated source parent
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ai-skill/scripts/publish_sync.py
