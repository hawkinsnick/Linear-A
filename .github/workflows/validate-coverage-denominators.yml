name: Validate bounded fleet denominators
on:
  pull_request:
  push:
    branches: [main]
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python corpus-factory/coverage_denominators.py
      - run: python -m unittest discover -s corpus-factory -p test_coverage_denominators.py
